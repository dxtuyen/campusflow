[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campusflow-ai"
version = "0.1.0"
description = "Classroom allocation and student movement optimization with CP-SAT"
requires-python = ">=3.11,<3.15"
dependencies = [
  "streamlit>=1.66,<2",
  "ortools>=9.12,<10",
  "pandas>=2.2,<4",
  "plotly>=6,<7",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["application*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
